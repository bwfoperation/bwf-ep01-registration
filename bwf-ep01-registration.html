<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กระดุมเม็ดแรก — ลงทะเบียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #130C05;
    --bg-2: #1F1610;
    --card: #241A13;
    --amber: #D9A754;
    --amber-soft: #6E4A22;
    --cream: #F2E7D8;
    --muted: #B3A190;
    --line: rgba(216,189,140,.3);
    --dot-red: #E8453B;
    --dot-grey: #6B5F52;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at 50% -10%, #2E2116 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'Noto Sans Thai', sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .stage{
    width:100%;
    max-width: 420px;
  }

  /* --- placket / progress: plain dots, first red, rest grey --- */
  .placket{
    display:flex;
    justify-content:center;
    gap: 18px;
    margin-bottom: 49px;
  }
  .btn-dot{
    width: 10px; height:10px;
    border-radius:50%;
    background: var(--dot-grey);
    transition: background .3s ease, transform .3s ease;
  }
  .btn-dot.filled{ background: var(--dot-red); }
  .btn-dot.active{
    background: var(--dot-red);
    transform: scale(1.15);
  }

  .card{

    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 26px 28px;
    min-height: 320px;
    display:flex;
    flex-direction:column;
  }
  .card.hero-frame{
    background:none;
    border:none;
    padding:0;
    min-height:0;
  }
  .hero-image-wrap{ position:relative; line-height:0; }
  .hero-flat-img{ width:100%; display:block; border-radius:18px; }
  .hero-cta-overlay{
    position:absolute;
    left:12.5%; top:84%; width:75%; height:7%;
    background:transparent;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .hero-time-overlay{
    position:absolute;
    left:0; top:69.6%; width:100%;
    text-align:center;
    font-family:'Noto Sans Thai', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.14em;
    color: var(--cream);
    line-height:1.3;
    pointer-events:none;
  }

  .eyebrow{
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
    margin-bottom: 10px;
  }
  h1{
    font-family:'Noto Sans Thai', sans-serif;
    font-weight:700;
    font-size: 26px;
    line-height:1.35;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .hint{
    font-size:14px;
    color: var(--muted);
    margin-bottom: 22px;
    line-height:1.6;
  }

  input[type=text], textarea{
    width:100%;
    background: transparent;
    border:none;
    border-bottom: 1px solid var(--line);
    color: var(--cream);
    font-size: 18px;
    padding: 10px 2px;
    outline:none;
    transition: border-color .25s ease;
  }
  input[type=text]:focus, textarea:focus{
    border-color: var(--amber);
  }
  textarea{ resize:none; min-height:90px; line-height:1.6; }
  ::placeholder{ color:#6E6154; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .opt{
    text-align:left;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--cream);
    font-size: 15.5px;
    padding: 14px 16px;
    border-radius: 12px;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .opt:active{ transform: translateY(1px); }
  .opt.selected{
    border-color: var(--amber);
    background: rgba(200,147,61,.14);
  }
  .opt small{ display:block; color:var(--muted); font-size:12.5px; margin-top:3px; }

  .drink-cards{ display:flex; gap:12px; margin-top:4px; }
  .drink-card{
    flex: 1 1 0;
    text-align:left;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .drink-card:active{ transform: translateY(1px); }
  .drink-card.selected{
    border-color: var(--amber);
    background: rgba(200,147,61,.14);
  }
  .drink-card-img{
    width: 100%;
    display:block;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .drink-card-row{ display:flex; align-items:center; gap:8px; }
  .drink-radio{
    width: 18px; height:18px;
    border-radius:50%;
    border: 1.5px solid var(--cream);
    flex: none;
    position:relative;
  }
  .drink-card.selected .drink-radio{ border-color: var(--amber); }
  .drink-card.selected .drink-radio::after{
    content:"";
    position:absolute; inset:3px;
    border-radius:50%;
    background: var(--amber);
  }
  .drink-card-label{ color:var(--cream); font-size:15px; }
  .drink-card-sub{ display:block; color:var(--muted); font-size:12.5px; margin-top:3px; margin-left:26px; }

  .spacer{ flex:1; }

  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: 26px;
    gap: 12px;
  }
  .btn-primary{
    background: var(--amber);
    color: #1B140F;
    border:none;
    font-weight:600;
    font-size: 15.5px;
    padding: 13px 26px;
    border-radius: 999px;
    cursor:pointer;
    transition: opacity .2s ease, transform .1s ease;
  }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary:not(:disabled):active{ transform: scale(.97); }
  .btn-back{
    background:none; border:none;
    color: var(--muted);
    font-size: 14px;
    cursor:pointer;
    padding: 8px 4px;
  }
  .btn-back:disabled{ visibility:hidden; }

  .screen{ animation: rise .38s ease; }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .hero{ text-align:center; }
  .hero .brand-mark{
    font-family: 'Noto Sans Thai', sans-serif;
    font-weight: 500;
    font-size: 20px;
    color: var(--cream);
    margin-bottom: 27px;
  }
  .hero .ep-label{
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .22em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 15px;
  }
  .hero h1{
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 13px;
  }
  .hero .hero-sub{
    font-style: italic;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .2em;
    color: var(--cream);
    text-transform: uppercase;
    margin-bottom: 33px;
  }

  .hero-button-icon{
    width: 102px; height:102px;
    margin: 0 auto 22px;
    display:block;
  }

  .hero .venue{ font-size:9.5px; font-weight:500; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
  .hero .venue b{ display:block; font-size:18px; font-weight:500; letter-spacing:normal; text-transform:none; color:var(--cream); margin-top:8px; margin-bottom:33px; }
  .hero .presented{ font-size:8.5px; font-weight:500; letter-spacing:.22em; color:var(--cream); text-transform:uppercase; margin-bottom:16px; }
  .hero .bwf-signature{ font-family:'Caveat', cursive; font-weight:700; font-size:34px; color:var(--cream); margin-bottom:37px; }

  .hero p{ color:var(--muted); font-size:14.5px; line-height:1.7; margin-bottom:26px; }
  .hero .btn-primary{ width:100%; padding:16px; font-size:16px; font-weight:600; }

  .done{ text-align:center; }
  .done h1{ font-size:26px; }
  .done .recap{
    margin-top: 18px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
    color: var(--muted);
    text-align:left;
    line-height:1.8;
  }
  .done .recap b{ color: var(--cream); font-weight:500; }
  .status{ font-size:12.5px; color:var(--muted); margin-top:14px; }

  .payment{ text-align:center; }
  .payment h1{ margin-bottom:10px; }
  .qr-img{
    width: 200px;
    max-width: 70%;
    border-radius: 14px;
    margin: 18px auto 10px;
    display:block;
    box-shadow: 0 10px 24px rgba(0,0,0,.4);
  }
  .pay-name{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .save-qr-btn{
    display:inline-block;
    font-size:13.5px;
    font-weight:500;
    color: var(--amber);
    background: transparent;
    border: 1px solid var(--amber);
    border-radius: 999px;
    padding: 9px 20px;
    text-decoration:none;
    cursor:pointer;
  }
  .save-qr-btn:active{ opacity:.75; }
  .slip-upload{
    display:block;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .2s ease;
  }
  .slip-upload:active{ border-color: var(--amber); }
  .slip-preview{
    width: 100%;
    max-width: 260px;
    border-radius: 10px;
    margin: 14px auto 0;
    display:block;
  }

  @media (prefers-reduced-motion: reduce){
    .screen{ animation:none; }
  }
</style>
</head>

  <div class="placket" id="placket"></div>

      "อยากเจอคนใหม่ ๆ",
      "อยากลอง Experience ใหม่ ๆ"
    ]},

      { label:"Non-alcoholic", sub:"", img: CAN_NONALC_B64 }
    ]}
];

let step = -1; // -1 = hero, 0..4 = questions, 5 = done
let answers = {};
let submitting = false;
let submitted = false;

const card = document.getElementById("card");
const placket = document.getElementById("placket");

function renderPlacket(){
  placket.innerHTML = QUESTIONS.map((_,i)=>{
    const filled = i < step ? "filled" : "";
    const active = i === Math.max(step, 0) && step < QUESTIONS.length ? "active" : "";
    return `<div class="btn-dot ${filled} ${active}"></div>`;
  }).join("");
}

function currentAnswerValid(){
  const q = QUESTIONS[step];
  const v = answers[q.key];
  if(q.type === "text") return !!(v && v.trim().length);
  if(q.type === "textarea") return true; // open-ended, optional
  if(q.type === "select" || q.type === "drink-cards") return !!v;
  return false;
}

function goHero(){
  step = -1;
  card.classList.add('hero-frame');
  card.innerHTML = `
    <div class="screen hero-image-wrap">
      <img class="hero-flat-img" src="data:image/jpeg;base64,${HERO_IMAGE_B64}" alt="กระดุมเม็ดแรก — Brew With Friends Ep.01">
      <div class="hero-time-overlay">26 Sep 2026 · 17:00–19:20</div>
      <button type="button" class="hero-cta-overlay" data-action="start" aria-label="เริ่มลงทะเบียน"></button>
    </div>`;
  placket.innerHTML = "";
}

function renderQuestion(){
  card.classList.remove('hero-frame');
  const q = QUESTIONS[step];
  let body = "";

  if(q.type === "text"){
    body = `<input type="text" id="field" placeholder="${q.placeholder}" value="${answers[q.key] || ""}" autocomplete="off">`;
  } else if(q.type === "textarea"){
    body = `<textarea id="field" placeholder="${q.placeholder}">${answers[q.key] || ""}</textarea>`;
  } else if(q.type === "select"){
    body = `<div class="options">` + q.options.map((opt,i)=>{
      const label = typeof opt === "string" ? opt : opt.label;
      const sub = typeof opt === "string" ? "" : `<small>${opt.sub}</small>`;
      const selected = answers[q.key] === label ? "selected" : "";
      return `<button type="button" class="opt ${selected}" data-action="select" data-idx="${i}">${label}${sub}</button>`;
    }).join("") + `</div>`;
  } else if(q.type === "drink-cards"){
    body = `<div class="drink-cards">` + q.options.map((opt,i)=>{
      const selected = answers[q.key] === opt.label ? "selected" : "";
      return `
        <button type="button" class="drink-card ${selected}" data-action="select" data-idx="${i}">
          <img class="drink-card-img" src="data:image/jpeg;base64,${opt.img}" alt="${opt.label}">
          <span class="drink-card-row">
            <span class="drink-radio"></span>
            <span class="drink-card-label">${opt.label}</span>
          </span>
          ${opt.sub ? `<span class="drink-card-sub">${opt.sub}</span>` : ""}
        </button>`;
    }).join("") + `</div>`;
  }

  card.innerHTML = `
    <div class="screen">
      <div class="eyebrow">${q.eyebrow}</div>
      <h1>${q.title}</h1>
      ${q.hint ? `<div class="hint">${q.hint}</div>` : `<div style="margin-bottom:22px;"></div>`}
      ${body}
      <div class="spacer"></div>
      <div class="nav">
        <button type="button" class="btn-back" data-action="prev" ${step===0 ? "disabled":""}>ย้อนกลับ</button>
        <button type="button" class="btn-primary" id="nextBtn" data-action="next">ต่อไป</button>
      </div>
    </div>`;

  renderPlacket();

  if(q.type !== "select" && q.type !== "drink-cards"){
    const field = document.getElementById("field");
    if(field) field.focus({ preventScroll:true });
  }
  updateNextState();
}

// --- single delegated listener for all clicks/inputs/keys, attached once ---
card.addEventListener("click", (e)=>{
  const target = e.target.closest("[data-action]");
  if(!target || target.disabled) return;
  const action = target.getAttribute("data-action");
  if(action === "start" || action === "next") nextStep();
  else if(action === "prev") prevStep();
  else if(action === "select"){
    const q = QUESTIONS[step];
    const idx = Number(target.getAttribute("data-idx"));
    const opt = q.options[idx];
    const label = typeof opt === "string" ? opt : opt.label;
    selectOption(q.key, label);
  }
  else if(action === "save-qr"){
    saveQrImage();
  }
});

function base64ToBlob(b64, mime){
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function saveQrImage(){
  const hint = document.getElementById('saveQrHint');
  try{
    const blob = base64ToBlob(QR_IMAGE_B64, 'image/jpeg');
    const file = new File([blob], 'bwf-promptpay-qr.jpg', { type: 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'PromptPay QR — Brew With Friends' });
      return;
    }
  } catch(err){
    console.error("Share QR error:", err);
  }
  if(hint) hint.textContent = 'บันทึกอัตโนมัติไม่ได้ในเบราว์เซอร์นี้ — กดค้างที่รูป QR ด้านบนแล้วเลือก "บันทึกรูปภาพ" แทนได้เลยครับ';
}

card.addEventListener("input", (e)=>{
  if(e.target && e.target.id === "field"){
    const q = QUESTIONS[step];
    if(q) { answers[q.key] = e.target.value; updateNextState(); }
  }
});

card.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && e.target && e.target.id === "field"){
    const q = QUESTIONS[step];
    if(q && q.type === "text"){ e.preventDefault(); nextStep(); }
  }
});

function updateNextState(){
  const btn = document.getElementById("nextBtn");
  if(!btn) return;
  btn.disabled = !currentAnswerValid();
}

function selectOption(key, label){
  answers[key] = label;
  renderQuestion();
}

        <span id="slipLabelText">แตะเพื่อแนบสลิปการโอนเงิน</span>
      </label>
      <img id="slipPreview" class="slip-preview" style="display:none;">

      <div class="spacer"></div>
      <div class="nav">
        <button type="button" class="btn-back" data-action="prev">ย้อนกลับ</button>
        <button type="button" class="btn-primary" id="nextBtn" data-action="next" ${slipDataUrl ? "" : "disabled"}>ยืนยันการลงทะเบียน</button>
      </div>
    </div>`;
  renderPlacket();

  const input = document.getElementById('slipInput');
  const preview = document.getElementById('slipPreview');
  const labelText = document.getElementById('slipLabelText');

  if(slipDataUrl){
    preview.src = slipDataUrl;
    preview.style.display = 'block';
    labelText.textContent = 'แนบสลิปแล้ว (แตะเพื่อเปลี่ยน)';
  }

  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    labelText.textContent = 'กำลังประมวลผลรูป...';
    try{
      slipDataUrl = await resizeImageFile(file, 800, 0.72);
      preview.src = slipDataUrl;
      preview.style.display = 'block';
      labelText.textContent = 'แนบสลิปแล้ว (แตะเพื่อเปลี่ยน)';
      document.getElementById('nextBtn').disabled = false;
    } catch(err){
      labelText.textContent = 'แนบไฟล์ไม่สำเร็จ ลองใหม่';
      console.error("Slip resize error:", err);
    }
  });
}

function resizeImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function saveRegistration(){
  const statusEl = document.getElementById("saveStatus");
  const id = `${STORAGE_KEY_PREFIX}:${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const record = { ...answers, slip: slipDataUrl, submittedAt: new Date().toISOString() };

  // local backup copy on this device, in case the request below fails
  try{
    localStorage.setItem(id, JSON.stringify(record));
  } catch(err){
    console.error("Local backup error:", err);
  }

  if(statusEl) statusEl.textContent = "กำลังบันทึก...";
  try{
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(record)
    });
    const resultText = await res.text();
    let ok = res.ok;
    try{ ok = ok && JSON.parse(resultText).result === "success"; } catch(parseErr){ /* ignore, keep res.ok */ }
    if(ok){
      if(statusEl) statusEl.textContent = "บันทึกเรียบร้อยแล้ว";
    } else {
      if(statusEl) statusEl.textContent = "ส่งข้อมูลไม่สำเร็จ กรุณาแจ้งแอดมิน (ข้อมูลสำรองอยู่ในเครื่องนี้แล้ว)";
      console.error("Submit not ok:", resultText);
    }
  } catch(err){
    if(statusEl) statusEl.textContent = "เชื่อมต่ออินเทอร์เน็ตไม่ได้ ลองเช็กสัญญาณแล้วรีเฟรชหน้านี้ (ข้อมูลสำรองอยู่ในเครื่องนี้แล้ว)";
    console.error("Submit error:", err);
  }
}

function nextStep(){
  if(step >= 0 && step < QUESTIONS.length && !currentAnswerValid()) return;
  if(step === QUESTIONS.length && !slipDataUrl) return;
  step++;
  if(step === QUESTIONS.length){ renderPayment(); return; }
  if(step > QUESTIONS.length){ renderDone(); return; }
  renderQuestion();
}

function prevStep(){
  if(step <= 0){ goHero(); return; }
  step--;
  if(step === QUESTIONS.length){ renderPayment(); return; }
  renderQuestion();
}

// --- lightweight read-only admin view: open with ?admin=bwf01 ---
async function renderAdmin(){
  card.innerHTML = `<div class="screen"><h1 style="font-size:20px;">รายชื่อผู้ลงทะเบียน</h1><div class="hint">กำลังโหลด...</div></div>`;
  placket.innerHTML = "";
  try{
    const list = await window.storage.list(STORAGE_KEY_PREFIX + ":", true);
    const keys = (list && list.keys) || [];
    if(!keys.length){
      card.innerHTML = `<div class="screen"><h1 style="font-size:20px;">รายชื่อผู้ลงทะเบียน</h1><div class="hint">ยังไม่มีข้อมูล</div></div>`;
      return;
    }
    const rows = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r) rows.push(JSON.parse(r.value));
      }catch(e){ /* skip unreadable entry */ }
    }
    rows.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    const rowsHtml = rows.map(r => `
      <div style="border-bottom:1px solid var(--line); padding:12px 0;">
        <div style="color:var(--cream); font-weight:500;">${r.nickname || "-"} <span style="color:var(--muted); font-weight:400; font-size:12.5px;">· ${r.drink || "-"}</span></div>
        <div style="color:var(--muted); font-size:13px; margin-top:4px;">${r.doing || ""}</div>
        <div style="color:var(--muted); font-size:13px; margin-top:4px;">${r.project || ""}</div>
        <div style="color:var(--muted); font-size:12px; margin-top:4px;">เหตุผล: ${r.reason || "-"}</div>
        ${r.slip ? `<img src="${r.slip}" style="width:100%;max-width:220px;border-radius:8px;margin-top:8px;display:block;">` : `<div style="color:#c0524a; font-size:12px; margin-top:6px;">ยังไม่แนบสลิป</div>`}
      </div>`).join("");
    card.innerHTML = `
      <div class="screen">
        <h1 style="font-size:20px;">รายชื่อผู้ลงทะเบียน (${rows.length})</h1>
        <div style="margin-top:14px; max-height:60vh; overflow:auto;">${rowsHtml}</div>
      </div>`;
  } catch(err){
    card.innerHTML = `<div class="screen"><h1 style="font-size:20px;">รายชื่อผู้ลงทะเบียน</h1><div class="hint">โหลดข้อมูลไม่สำเร็จ</div></div>`;
    console.error(err);
  }
}

const params = new URLSearchParams(window.location.search);
if(params.get("admin") === "bwf01"){
  renderAdmin();
} else {
  goHero();
}
